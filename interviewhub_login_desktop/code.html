<body class="bg-surface text-on-surface font-body-md min-h-screen flex items-center justify-center p-4">
<!-- Login Container -->
<div class="bg-surface-container-lowest w-full max-w-[480px] rounded-xl border border-surface-variant shadow-[0px_4px_20px_rgba(0,0,0,0.04)] p-stack-lg relative overflow-hidden">
<!-- Subtle Ambient Glow -->
<div class="absolute -top-32 -right-32 w-64 h-64 bg-secondary-fixed/20 rounded-full blur-3xl pointer-events-none"></div>
<!-- Header / Logo -->
<div class="flex flex-col items-center justify-center text-center mb-stack-lg">
<div class="w-12 h-12 bg-primary rounded-lg flex items-center justify-center mb-stack-md shadow-sm">
<span class="material-symbols-outlined text-on-primary text-[28px]" data-icon="hub">hub</span>
</div>
<h1 class="font-h2 text-h2 text-primary tracking-tight">InterviewHub</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-stack-sm">Sign in to continue your recruitment journey.</p>
</div>
<!-- SSO Buttons -->
<div class="space-y-stack-md mb-stack-lg">
<button class="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-DEFAULT border border-outline-variant bg-surface-container-lowest hover:bg-surface-container-low transition-colors duration-200">
<img class="w-5 h-5" data-alt="A small, high-quality, recognizable GitHub logo icon designed for a modern user interface. The icon uses a sleek, solid black silhouette on a white background, representing the popular developer platform. It is clean, crisp, and perfectly scaled for a digital button, reflecting a professional technical recruitment context." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCxKipqXVySJ9T5dGzIrlhIHOPqmrq8t_vM425d7vLcVvF5yXYY8O45WkPyzQnz5_JEQSU2YlUD9C2d4w36aL306A_0RCxIRf_Yz_scGWO3nJUTqM2lf47Rzs457tJ-R9CCBMsn0IrQvddWP2ghXGjyAz2a0d7AnVRVwPtGnttUEJ_uriXtb1bZYARFjVQ6jOMj5dF9MKu03npLFDL3eiCVPJLNvKyQd3kjmwbidlxVE6aGq-EX35bX"/>
<span class="font-body-md text-body-md font-medium text-on-surface">Continue with GitHub</span>
</button>
<button class="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-DEFAULT border border-outline-variant bg-surface-container-lowest hover:bg-surface-container-low transition-colors duration-200">
<img class="w-5 h-5" data-alt="A small, high-quality, recognizable Google 'G' logo icon designed for a modern user interface. The icon features the standard multi-colored Google brand colors (blue, red, yellow, green) on a white background. It is clean, crisp, and perfectly scaled for a digital single sign-on button, reflecting a reliable and professional service." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA6TFk8mAc0sjAaqFNFlQj4l8S7saNyzG8pCrs5Irf7rIVZ-iS7l-Glkv2J0znkomxlS3OPVPE3sY6yfxcS8fbcMAv7PU8yDG_BLIiv6UrzaqY11hejQzeRrA56Buoe-sFAr4oP_wfEYDYBYyXusiq3AhtDQpkW0MupAdUxnLYBSzNTBYAFUFo8-tNnuQQBRa0YselM10IZYbVFY8rykBqyL1jiQZutQpCA_PPEBoJBqxYenQD_ugfr"/>
<span class="font-body-md text-body-md font-medium text-on-surface">Continue with Google</span>
</button>
</div>
<!-- Divider -->
<div class="flex items-center gap-4 mb-stack-lg">
<div class="flex-1 h-px bg-outline-variant"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Or</span>
<div class="flex-1 h-px bg-outline-variant"></div>
</div>
<!-- Form -->
<form class="space-y-stack-lg">
<div class="space-y-stack-md">
<div class="space-y-stack-sm">
<label class="block font-body-sm text-body-sm font-medium text-on-surface" for="email">Email address</label>
<div class="relative ai-cyan-glow rounded-DEFAULT transition-shadow duration-200">
<input class="w-full pl-4 pr-10 py-3 bg-surface-container-lowest border border-outline-variant rounded-DEFAULT text-on-surface font-body-md focus:ring-0 focus:outline-none placeholder:text-outline" id="email" placeholder="name@company.com" type="email"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none" data-icon="mail">mail</span>
</div>
</div>
<div class="space-y-stack-sm">
<div class="flex items-center justify-between">
<label class="block font-body-sm text-body-sm font-medium text-on-surface" for="password">Password</label>
<a class="font-body-sm text-body-sm text-secondary hover:text-secondary-container transition-colors duration-200" href="#">Forgot password?</a>
</div>
<div class="relative ai-cyan-glow rounded-DEFAULT transition-shadow duration-200">
<input class="w-full pl-4 pr-10 py-3 bg-surface-container-lowest border border-outline-variant rounded-DEFAULT text-on-surface font-body-md focus:ring-0 focus:outline-none placeholder:text-outline" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>
<button class="w-full py-3 px-4 bg-primary text-on-primary font-body-md font-medium rounded-DEFAULT hover:bg-primary/90 active:scale-[0.98] transition-all duration-200 shadow-sm flex items-center justify-center gap-2" type="submit">
                Sign In
                <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer -->
<div class="mt-stack-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Don't have an account? <a class="text-secondary font-medium hover:text-secondary-container transition-colors duration-200" href="#">Sign up</a>
</p>
